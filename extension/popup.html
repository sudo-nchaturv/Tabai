<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Tab Summarizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Tab Summarizer</h1>
    </header>

    <!-- Settings Section: API Key -->
    <section id="settings-section" class="section">
      <div class="input-group">
        <label for="api-key">Gemini API Key</label>
        <input type="password" id="api-key" placeholder="Enter your Gemini API Key" />
        <button id="save-key-btn" class="btn secondary">Save Key</button>
      </div>
      <div id="api-key-status" class="status-message"></div>
    </section>

    <!-- Ask Section -->
    <section id="ask-section" class="section">
      <div class="input-group">
        <label id="ask-label" for="ask-input">Chat with current tab</label>
        <textarea id="ask-input" rows="2" placeholder="Ask a question about the content..."></textarea>
        <button id="ask-btn" class="btn primary">Ask Question</button>
      </div>
    </section>

    <!-- Main Actions Section -->
    <section id="main-actions" class="section">
      <button id="summarize-current-btn" class="btn primary">Summarize Current Tab</button>
      <button id="select-tabs-mode-btn" class="btn secondary">Select Tabs to Chat With</button>
    </section>

    <!-- Tab Selection Section (Hidden by default) -->
    <section id="tab-selection-section" class="section hidden">
      <h3>Select tabs to chat with</h3>
      <div id="tab-list" class="tab-list">
        <!-- Checkboxes for tabs will be dynamically inserted here -->
      </div>
      <button id="confirm-selection-btn" class="btn primary">Confirm Selection</button>
      <button id="cancel-selection-btn" class="btn secondary">Cancel</button>
    </section>

    <!-- Results Section -->
    <section id="results-section" class="section">
      <div id="loading-indicator" class="hidden">
        <div class="spinner"></div>
        <span>Processing...</span>
      </div>

      <div id="error-message" class="error-message hidden"></div>

      <div id="results-content" class="results-content">
        <!-- Results will be dynamically inserted here -->
      </div>

      <div class="results-actions hidden" id="results-actions">
          <button id="copy-summary-btn" class="btn secondary">Copy</button>
      </div>
    </section>

  </div>

  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
